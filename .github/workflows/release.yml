name: Test and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest

      - name: Compile Python
        run: python -m compileall -q custom_components tests

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bump manifest patch version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/svg_floorplan/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          parts = manifest["version"].split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Expected a numeric MAJOR.MINOR.PATCH version, got {manifest['version']!r}")
          parts[2] = str(int(parts[2]) + 1)
          manifest["version"] = ".".join(parts)
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={manifest['version']}\n")
          PY

      - name: Commit version and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/svg_floorplan/manifest.json
          git commit \
            -m "Bump integration version to ${VERSION}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin HEAD:main "refs/tags/v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "${VERSION}" \
            --notes "Automated release after the main-branch test suite passed."
