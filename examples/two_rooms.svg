<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360">
  <rect width="500" height="360" fill="#dce7ef"/>
  <text x="250" y="38" text-anchor="middle" font-family="sans-serif"
        font-size="20" fill="#253746">Outside</text>

  <g id="outside" data-ha-entity="sensor.teplomer_venku_temperature">
    <rect id="outside-area" data-ha-role="area" x="30" y="60" width="440" height="260"
          rx="12" fill="#dce7ef" stroke="#253746" stroke-width="4"/>
    <text id="outside-temperature" data-ha-role="value" x="250" y="105" text-anchor="middle"
          font-family="sans-serif" font-size="28" fill="#17212b">—</text>
  </g>

  <g id="living-room"
     data-ha-entity="sensor.teplomer_obyvak_temperature"
     data-ha-min="16"
     data-ha-comfort="22"
     data-ha-max="28"
     data-ha-unit="°C">
    <rect id="living-room-area" data-ha-role="area" x="125" y="135" width="250" height="150"
          rx="8" fill="#22C55E" stroke="#17212b" stroke-width="4"/>
    <text x="250" y="192" text-anchor="middle" font-family="sans-serif"
          font-size="20" fill="#17212b">Living room</text>
    <text id="living-room-temperature" data-ha-role="value" x="250" y="238" text-anchor="middle"
          font-family="sans-serif" font-size="28" fill="#17212b">—</text>
  </g>
</svg>
